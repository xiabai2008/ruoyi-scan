# Ruoyi-Scan — 项目元数据与依赖规范（PEP 621）
# 安装方式：
#   pip install .                    # 仅核心依赖
#   pip install ".[report]"          # 核心 + 报告增强
#   pip install ".[serve]"           # 核心 + Web API
#   pip install ".[distributed]"     # 核心 + Redis 分布式
#   pip install ".[async]"           # 核心 + aiohttp 异步
#   pip install ".[yaml]"            # 核心 + YAML 配置
#   pip install ".[all]"             # 全部可选依赖
#   pip install ".[dev]"             # 开发/测试依赖
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyi-scan"
version = "1.2.2"
description = "若依（RuoYi）专项漏洞扫描器 — 插件化架构 / 三态判定 / 38 POC / OAST / 业务逻辑 / 分布式 / SIEM"
readme = "README.md"
license = "MIT"
authors = [
    { name = "XIABAI", email = "1204798391@qq.com" }
]
requires-python = ">=3.8"
keywords = ["ruoyi", "vulnerability-scanner", "security", "pentest", "spring", "poc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# 核心依赖（零系统依赖，必装）
dependencies = [
    "requests>=2.28",
    "requests-mock>=1.11",
]

# 可选依赖分组（pip install ".[group]"）
[project.optional-dependencies]
# 报告增强：PDF / Word / Excel
report = [
    "reportlab>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
# Web API 服务：FastAPI + WebSocket
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
# 分布式扫描：Redis Master-Worker 队列
distributed = [
    "redis>=4.5",
]
# 异步引擎：aiohttp 异步 HTTP 客户端
async = [
    "aiohttp>=3.8",
]
# YAML 配置文件
yaml = [
    "pyyaml>=6.0",
]
# 靶场环境（lab/）
lab = [
    "flask>=2.3",
]
# 全部可选依赖
all = [
    "reportlab>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "redis>=4.5",
    "aiohttp>=3.8",
    "pyyaml>=6.0",
    "flask>=2.3",
]
# 开发/测试依赖
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

# CLI 入口点：安装后可直接 ruoyi-scan -p http://target/
[project.scripts]
ruoyi-scan = "main:main"

# 插件入口点（P1: 第三方插件通过 pip install 自动注册）
# 第三方插件包在自身 pyproject.toml 中声明：
#   [project.entry-points."ruoyi_scan.plugins"]
#   my-plugin = "my_plugin_pkg:plugin_list"
# 安装后 ruoyi-scan 自动发现并加载，无需 --plugin-path
[project.entry-points."ruoyi_scan.plugins"]
# 内置插件不在此注册（通过 discover_plugin_packages 自动扫描）

[project.urls]
Homepage = "https://github.com/xiabai2008/Ruoyi-Scan"
Repository = "https://github.com/xiabai2008/Ruoyi-Scan"
Issues = "https://github.com/xiabai2008/Ruoyi-Scan/issues"

[tool.setuptools]
# 显式声明包目录（非 src-layout）
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["common*", "cli*", "core*", "lib*", "api*", "plugins*", "config*", "chains*", "data*"]
exclude = ["tests*", "lab*", "web*", "monitoring*", ".github*", ".reasonix*"]

[tool.setuptools.package-data]
# 字典文件必须随包分发（安装版 Druid 爆破/默认口令依赖 data/*.txt）
data = ["*.txt"]

# ── 开发工具配置 ──

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
# 仅启用关键规则：错误(E) / pyflakes(F) / 警告(W) / 导入排序(I) / 命名(N)
# 跳过 SIM(代码简化) / B(bugbear) / UP(版本升级) 等非阻塞风格建议
select = ["E", "F", "W", "I", "N"]
ignore = [
    "E501",   # 行长度由 line-length 控制，不强制警告
    "E722",   # 裸 except（项目中有意为之的兜底捕获）
    "N806",   # 变量名大小写（如 F=_FONT_NAME 是字体常量惯例）
    "N818",   # 异常名后缀（项目已有 Exception 命名惯例）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许更宽松
"tests/*" = ["N802", "N803", "E402", "F841"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true

# common/ 和 core/ 启用严格模式（共享基础层 + 核心引擎层）
# CI 中通过 `mypy common/ core/ --strict --ignore-missing-imports` 执行
[[tool.mypy.overrides]]
module = ["common.*", "core.*"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true

# lib/ 和 api/ 保持宽松（后续逐步收紧）
[[tool.mypy.overrides]]
module = ["lib.*", "api.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --timeout=30 --timeout-method=thread"
