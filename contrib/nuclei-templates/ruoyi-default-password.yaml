id: ruoyi-default-password

info:
  name: RuoYi - Default Administrator Credentials
  author: xiabai2008
  severity: high
  description: |
    RuoYi management panel accepts the documented default administrator
    credentials (admin/admin123) and returns a session token, indicating the
    default credentials are still in use.
  reference:
    - https://github.com/xiabai2008/ruoyi-scan
    - https://doc.ruoyi.vip/
  classification:
    cwe-id: CWE-1392
  metadata:
    max-request: 2
    product: ruoyi
    vendor: ruoyi
    ruoyi-scan-lab-verified: true
  tags: ruoyi,default-login,misconfig,vuln

http:
  # RuoYi v4 (Thymeleaf / form login)
  # stop-at-first-match：v4 命中后不再执行 v5 请求，避免同一目标被重复报告两次
  - method: POST
    stop-at-first-match: true
    path:
      - "{{BaseURL}}/login"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "username=admin&password=admin123&rememberMe=false&validateCode="

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      # 认证失败同样返回 200 + JSON（如 {"msg":"用户不存在/密码错误","code":500}），
      # 必须显式排除失败文案，否则被拒绝的登录也会被当成成功
      - type: word
        part: body
        words:
          - "用户不存在"
          - "密码错误"
          - "登录失败"
        negative: true

      # 登录成功才下发 token：要求 token 字段带非空值，而非页面任意位置出现 token 子串
      - type: regex
        part: body
        regex:
          - '"token"\s*:\s*"[^"]+"'

  # RuoYi v5 (Vue / JSON login)
  - method: POST
    path:
      - "{{BaseURL}}/login"
    headers:
      Content-Type: application/json
    body: '{"username":"admin","password":"admin123","code":"","uuid":""}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      # 与 v4 相同：排除认证失败文案
      - type: word
        part: body
        words:
          - "用户不存在"
          - "密码错误"
          - "登录失败"
        negative: true

      # 要求非空 token 字段，而非裸 "token" 子串
      - type: regex
        part: body
        regex:
          - '"token"\s*:\s*"[^"]+"'
