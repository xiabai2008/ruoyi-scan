id: ruoyi-default-password

info:
  name: RuoYi - Default Administrator Credentials
  author: xiabai2008
  severity: high
  description: |
    RuoYi management panel accepts the documented default administrator
    credentials (admin/admin123). An attacker can obtain a valid session
    token and take over the backend.
  reference:
    - https://github.com/xiabai2008/ruoyi-scan
    - https://doc.ruoyi.vip/
  classification:
    cwe-id: CWE-1392
  metadata:
    max-request: 2
    product: ruoyi
    vendor: ruoyi
    ruoyi-scan-lab-verified: true
  tags: ruoyi,default-login,misconfig,vuln

http:
  # RuoYi v4 (Thymeleaf / form login)
  - method: POST
    path:
      - "{{BaseURL}}/login"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "username=admin&password=admin123&rememberMe=false&validateCode="

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      # A session token is only issued on successful authentication
      - type: word
        part: body
        words:
          - "token"

  # RuoYi v5 (Vue / JSON login)
  - method: POST
    path:
      - "{{BaseURL}}/login"
    headers:
      Content-Type: application/json
    body: '{"username":"admin","password":"admin123","code":"","uuid":""}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: word
        part: body
        words:
          - "token"
