id: ruoyi-job-unauth

info:
  name: RuoYi - Scheduled Task Endpoint Unauthenticated Access
  author: xiabai2008
  severity: medium
  description: |
    The RuoYi scheduled task list endpoint (/monitor/job/list) is readable
    without authentication and returns the task listing instead of an
    authentication error. When combined with a weak or default administrator
    account this class of exposure enables scheduled task abuse; by itself it
    indicates a broken authorization configuration.
  reference:
    - https://github.com/xiabai2008/ruoyi-scan
  classification:
    cwe-id: CWE-306
  metadata:
    max-request: 1
    product: ruoyi
    vendor: ruoyi
    ruoyi-scan-lab-verified: true
  tags: ruoyi,unauth,misconfig

http:
  # Read-only probe: GET the job list endpoint. A state-changing POST to
  # /monitor/job/edit (previous implementation) could silently overwrite a
  # production scheduled task on a vulnerable instance, i.e. a destructive scan.
  - method: GET
    path:
      - "{{BaseURL}}/monitor/job/list"
    headers:
      Accept: application/json

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # Reached the business layer: a real job list envelope (rows/total fields),
      # not an auth wall. "code":500 is NOT accepted here: RuoYi returns code 500
      # for generic validation/exception failures that never reach the job logic
      # (e.g. malformed input, method not supported), which caused false positives.
      - type: word
        part: body
        words:
          - '"rows"'
          - '"total"'
        condition: or

      # Exclude explicit authorization failures and login redirects.
      # 用 (?i) 正则而非大小写敏感 word：原写法会漏掉 "unauthorized"/"Login" 等变体；
      # 正则同时收敛了 "code":401 / "code": 401 的空格变体
      - type: regex
        part: body
        negative: true
        regex:
          - '(?i)"code"\s*:\s*40[13]'
          - '(?i)unauthorized'
          - '(?i)forbidden'
          - '(?i)login'
