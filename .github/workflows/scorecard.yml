# OpenSSF Scorecard：供应链安全评分（G4 信任建设）
# 结果发布到 OSSF 公共 API（徽章）+ 上传 GitHub Code Scanning（SARIF）
name: Scorecard supply-chain security

on:
  # 分支保护配置变更时（评分项之一）
  branch_protection_rule:
  # 每周一 02:31 UTC 定期评分
  schedule:
    - cron: '31 2 * * 1'
  # main 分支推送时增量评分
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

# 并发控制：同一 ref 的 push/schedule/dispatch run 互相取消。评分幂等，取消旧 run 可避免
# 重叠占用 runner，以及并发发布 OSSF 结果时的竞态。
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # 上传 SARIF 到 Code Scanning
      id-token: write         # 发布结果到 OSSF 公共 API（OIDC）
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # 公开发布评分（供徽章/查看器消费）；仅对公共仓库生效
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
