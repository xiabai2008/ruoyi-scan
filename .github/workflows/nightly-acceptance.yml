# Ruoyi-Scan Nightly Acceptance（F4）
# 每晚对 lab/ 真实靶场跑全量验收：vuln 模式漏报门禁 + safe 模式误报门禁
# 失败时自动创建 GitHub issue
name: Nightly Acceptance

on:
  schedule:
    # 每天 20:00 UTC = 北京 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

# Scorecard Token-Permissions：顶层只读，写权限在 job 级按需提升
permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # 失败时自动建 issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip  # pip 缓存：nightly 免去重复下载依赖，降低 PyPI 抖动影响
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build & start lab targets (vuln + safe)
        run: |
          docker build -q -t ruoyi-scan-lab ./lab
          # LAB_HOST=0.0.0.0 必须显式传入：v1.2.0 安全收口后靶场默认绑定 127.0.0.1，
          # 容器内绑定回环会导致 Docker 端口映射无法到达（健康检查必超时）。
          # docker-compose.yml 已覆盖此变量，裸 docker run 需自行传入。
          docker run -d --name lab-vuln --rm -e LAB_MODE=vuln -e LAB_HOST=0.0.0.0 -e LAB_PORT=8080 -p 8080:8080 ruoyi-scan-lab
          docker run -d --name lab-safe --rm -e LAB_MODE=safe -e LAB_HOST=0.0.0.0 -e LAB_PORT=8081 -p 8081:8081 ruoyi-scan-lab
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1 && curl -sf http://127.0.0.1:8081/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "lab 靶场启动超时" && exit 1

      - name: Run acceptance comparison
        id: acceptance
        run: |
          set +e
          python lab/run_acceptance.py \
            --baseline data/acceptance_baseline.json \
            --output acceptance.json
          gate=$?
          echo "exit=$gate" >> "$GITHUB_OUTPUT"
          set -e
          cat acceptance.json
          # 门禁失败必须让本 step/job 变红：否则最后一条 cat 成功会吞掉退出码，
          # 工作流显示绿色、不触发 failure 通知（只有建 issue 一条信号）。
          exit $gate

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-report
          path: acceptance.json

      - name: Create issue on failure
        # 覆盖两类失败：靶场启动超时（build step 失败）与验收对拍不通过（exit != 0）。
        # 旧条件仅依赖 acceptance 输出，启动失败时该 step 被跳过、永不建 issue。
        if: failure() || steps.acceptance.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create acceptance --color D93F0B --description "Nightly 验收失败" --force
          # 去重：同一持续失败只保留一个 open issue，避免每晚刷屏
          existing=$(gh issue list --label acceptance --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "已存在 open issue #$existing，跳过创建"
            exit 0
          fi
          gh issue create \
            --title "Nightly 验收失败（$(date -u +%Y-%m-%d)）" \
            --label "acceptance" \
            --body "Nightly 真实靶场验收未通过，运行日志见 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          $(cat acceptance.json 2>/dev/null || echo 'acceptance.json 未生成（靶场启动阶段即失败）')
          "

      - name: Enforce acceptance gate
        # 必须放在最后：上面「Run acceptance comparison」用 set +e 吞掉了退出码（为了把
        # 报告写进 issue 正文），「Create issue on failure」又只建 issue 不置败——两者都
        # 成功收尾，job 恒为绿。结果就是验收连续失败 16 天（2026-09-19 ~ 10-04）却没有任何
        # 红色信号，只能靠人工翻 issue 列表发现。此 step 把失败重新暴露为 run 失败。
        if: always()
        run: |
          if [ "${{ steps.acceptance.outputs.exit }}" != "0" ]; then
            echo "::error::Nightly 验收未通过（run_acceptance.py 退出码 '${{ steps.acceptance.outputs.exit }}'）"
            exit 1
          fi
          echo "验收通过"
