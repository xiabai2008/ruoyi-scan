# CodeQL 静态代码分析（G4 信任建设：Scorecard SAST 项 + Code Scanning 闭环）
# Python 无需编译，build-mode 默认 none；告警进 Security 标签页（不阻塞 CI）
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'  # 每周日 03:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write  # 上传分析结果到 Code Scanning
      packages: read          # CodeQL 查询包拉取
      actions: read           # 私有仓库需读取 workflow 元数据（公共仓库无害）
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
