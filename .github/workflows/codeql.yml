# CodeQL 静态代码分析（G4 信任建设：Scorecard SAST 项 + Code Scanning 闭环）
# Python 无需编译，build-mode 默认 none；告警进 Security 标签页（不阻塞 CI）
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'  # 每周日 03:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write  # 上传分析结果到 Code Scanning
      packages: read          # CodeQL 查询包拉取
      actions: read           # 私有仓库需读取 workflow 元数据（公共仓库无害）
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:python"
