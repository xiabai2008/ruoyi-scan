# Ruoyi-Scan 持续安全扫描（E6：GitHub Code Scanning 闭环）
# PR 触发 + 每周定时扫描；SARIF 上传到 GitHub Code Scanning，高危漏洞在 PR 页面展示
name: Security Scan

# Scorecard Token-Permissions：顶层只读，写权限在 job 级按需提升
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  schedule:
    # 每周一凌晨 2 点（UTC 18:00 = Beijing 02:00）
    - cron: '0 18 * * 1'

# 并发控制：同一事件 + ref 的新 run 取消同组旧 run，避免 PR 连推时多实例竞争
# security-events 上传；schedule（ref 同为 main）独立成组，不被 push/PR 取消
concurrency:
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # SARIF 上传 Code Scanning
    # 排除 fork PR：fork 拿不到 SCAN_TARGET secret（扫描无目标）且 GITHUB_TOKEN 只读
    # （upload-sarif 必失败），放行只会给外部贡献者一个永远失败的检查项。
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip  # pip 缓存：免去每周扫描重复下载依赖
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Run Ruoyi-Scan
        env:
          SCAN_TARGET: ${{ secrets.SCAN_TARGET }}
        run: |
          python main.py --ci -u "$SCAN_TARGET" \
            --report reports/ \
            --report-format sarif,json \
            --severity-threshold high \
            --components

      - name: Upload SARIF to GitHub Code Scanning
        # 仅当扫描产出了 SARIF 时才上传，避免文件缺失在原始失败之上叠加第二个噪声失败
        if: always() && hashFiles('reports/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          sarif_file: reports/report.sarif

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports
          path: reports/
