name: Publish to PyPI

# 触发：推送 v* 标签（如 v1.1.0）时自动构建并发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tool
        run: pip install build
      - name: Build sdist & wheel
        run: python -m build
      - name: Verify metadata
        run: |
          python -c "
          import zipfile, json
          whl = [f for f in __import__('glob').glob('dist/*.whl')][0]
          z = zipfile.ZipFile(whl)
          meta = z.read([n for n in z.namelist() if n.endswith('METADATA')][0]).decode()
          print('=== METADATA (前 20 行) ===')
          print('\n'.join(meta.split('\n')[:20]))
          ep = z.read([n for n in z.namelist() if n.endswith('entry_points.txt')][0]).decode()
          print('=== entry_points ===')
          print(ep)
          "
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # 需要 GitHub Environment "pypi" 配置 PYPI_API_TOKEN
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # 如使用 Trusted Publisher（推荐），删除 password，改用：
          # attestations: true

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          name: Release ${{ steps.tag.outputs.VERSION }}
          generate_release_notes: true  # 自动从 commits 生成 changelog
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## Ruoyi-Scan ${{ steps.tag.outputs.VERSION }}

            ### 安装

            ```bash
            pip install ruoyi-scan==${{ steps.tag.outputs.VERSION }}
            # 或安装全部可选依赖
            pip install "ruoyi-scan[all]==${{ steps.tag.outputs.VERSION }}"
            ```

            ### 使用

            ```bash
            ruoyi-scan -p http://target.example.com/
            ```

            ---
            完整变更日志见 [commits](https://github.com/xiabai2004/Ruoyi-Scan/commits/main)
