# Desktop Release workflow：tag 推送时构建 Windows 单 exe / NSIS 安装包 / 终端版 exe
#
# 触发条件：推送 v* 格式的 tag（与 release.yml 共用触发条件，两工作流并行运行）
# 产物：
#   - Ruoyi-Scan_<version>_x64-setup.exe  （NSIS 安装包：单 exe 壳 + 内嵌引擎，双击即用）
#   - ruoyi-scan-desktop.exe              （单文件版：引擎已内嵌，免安装直接双击）
#   - ruoyi-scan.exe                      （终端版：PyInstaller onefile，console，与 pip 版同一套 CLI）
#   - ruoyi-scan-command-manual.txt       （命令速查，随资产分发，下载者无需回仓库翻 README）
#   - ruoyi-scan-usage-guide.txt          （使用指导：场景 / 技巧 / 合规）
#   - ruoyi-scan-plugins.txt              （54 个 POC 清单与 CVE 索引）
#   - checksums-desktop.txt               （SHA256 供应链校验，覆盖上述三个 exe）
#
# 零配置体验说明：
#   引擎（Python 运行时 + 54 POC + 字典 + Web 控制台）经 PyInstaller 冻结为
#   ruoyi-scan-engine.exe，编译期整块嵌入壳二进制（build.rs → include_bytes!）。
#   首次运行自解压到 %LOCALAPPDATA%\Ruoyi-Scan\engine\ 并拉起 127.0.0.1:8123。
#   用户：下载 → 双击 → 扫描。无需 Python / Node / Rust，安装器只是可选加分项。

name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发：仅构建 + 冒烟，不上传 Release

# 并发控制：同一 ref 的构建串行执行，避免两次 tag 推送（或 tag 与手动触发）并行
# 竞争共享资源：本地 8123 端口、安装/卸载状态、同一个 GitHub Release。
# 发布产物不可半途而废，故不取消 in-progress run（排队等待而非抢占）。
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# Scorecard Token-Permissions：顶层只读，写权限在 job 级按需提升
permissions:
  contents: read

jobs:
  desktop-release:
    name: Build Windows Desktop Single-Exe
    runs-on: windows-latest
    permissions:
      contents: write  # 创建 Release 需要
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # tag 与代码版本不一致时先停：桌面端产物名、exe 文件属性、报告页脚都取自版本号，
      # 打错了版本会连带一串资产名错误（历史上出现过 1.5.1 的 wheel 挂在 1.5.2 页面）。
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/check_version.py --tag "$env:REF_NAME"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # 第三方 action 按 SHA 固定（Scorecard 供应链要求）；toolchain: stable 输入保持
      # 「始终以当前 Rust stable 通道构建」语义，固定 ref 不冻结工具链版本。
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-release

      # ---------- 阶段 1：PyInstaller 冻结引擎（稍后由 build.rs 嵌入壳内）----------
      - name: Build engine exe (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          # 依赖固定精确版本（供应链 + 可复现构建）；升级时同步 desktop/engine/build-engine.cmd
          # 安全下限与本地构建脚本保持一致：避免 CI 复用旧传递依赖打出带已知漏洞的引擎
          pip install pyinstaller==6.22.3 fastapi==0.143.0 "uvicorn[standard]==0.54.0" requests==2.34.2 requests-mock==1.12.1 reportlab==5.0.1 python-docx==1.2.0 openpyxl==3.1.5 pyyaml==6.0.3 "apscheduler>=3.10,<4" "urllib3>=2.8.0" "pillow>=13.0.0" "setuptools>=84.2.1" "certifi>=2026.10.19"
          pyinstaller desktop/engine/ruoyi-scan-engine.spec --noconfirm --distpath desktop/engine/dist --workpath desktop/engine/build

      # 引擎冒烟：onefile 解压 + 启动 API + 文档 200，任何一步失败即终止
      - name: Smoke test engine exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "desktop/engine/dist/ruoyi-scan-engine.exe"
          if (-not (Test-Path $exe)) { throw "engine exe not found: $exe" }
          Write-Host "size: $((Get-Item $exe).Length / 1MB) MB"

          # 就绪等待（onefile 首次解压 + Python 启动，最多 90s）
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--serve","--host","127.0.0.1","--port","8123" `
            -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($i in 1..90) {
              Start-Sleep -Seconds 1
              try {
                $docs = Invoke-WebRequest -Uri "http://127.0.0.1:8123/docs" -UseBasicParsing -TimeoutSec 3
                if ($docs.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              if ($proc.HasExited) { throw "engine exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw "engine not ready after 90s" }
            Write-Host "ENGINE_SMOKE_OK"
          } finally {
            # PyInstaller onefile 是「引导进程 + 真实引擎」双进程：Stop-Process 单杀引导进程
            # 会留下仍持有 8123 的真实引擎，污染后续 portable 冒烟（壳会误判「后端已在线」早退）。
            # 必须按进程名清干净，确认端口释放后才继续。
            Get-Process -Name "ruoyi-scan-engine" -ErrorAction SilentlyContinue | Stop-Process -Force
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            $freed = $false
            foreach ($i in 1..15) {
              Start-Sleep -Seconds 1
              if (-not (Get-NetTCPConnection -LocalPort 8123 -State Listen -ErrorAction SilentlyContinue)) { $freed = $true; break }
            }
            if (-not $freed) { throw "port 8123 still held after engine smoke cleanup" }
            Write-Host "ENGINE_SMOKE_CLEANUP_OK (8123 freed)"
          }

      # 插件清单随资产分发，必须与插件源码同步：不同步就别打包，免得发出去的覆盖范围是错的。
      # 失败信息会提示本地重新生成命令；CI 不自动改文件（改了也提交不回去）。
      - name: Verify plugin list matches plugins
        run: python scripts/export_plugin_list.py --check

      # ---------- 阶段 1.5：终端版单文件 exe（console，与 pip 版同一 CLI）----------
      # 与桌面引擎的区别：入口是 main.py 的 CLI，--report/--serve/--distributed 全保留，
      # 产物不嵌进任何壳，直接作为 Release 资产分发。
      # 可选依赖固定版本：redis(--distributed) / aiohttp(--async) / cryptography(插件验签)
      - name: Build CLI exe (PyInstaller)
        run: |
          pip install redis==8.1.0 aiohttp==3.14.5 cryptography==50.0.2
          pyinstaller tools/cli_build/ruoyi-scan.spec --noconfirm --distpath tools/cli_build/dist --workpath tools/cli_build/build

      # 隔离目录 + 真扫靶场：证明 exe 自包含（不读工作区的 plugins/data）且 7 格式依赖齐全
      - name: Smoke test CLI exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "tools/cli_build/dist/ruoyi-scan.exe"
          if (-not (Test-Path $exe)) { throw "cli exe not found: $exe" }
          Write-Host "size: $((Get-Item $exe).Length / 1MB) MB"

          # 复制到仓库外运行：确保插件与字典来自 exe 内部
          $iso = "$env:RUNNER_TEMP\ruoyi-cli"
          New-Item -ItemType Directory -Force -Path $iso | Out-Null
          Copy-Item $exe "$iso/ruoyi-scan.exe"

          $ver = (& "$iso/ruoyi-scan.exe" -V | Out-String).Trim()
          if ($ver -notmatch 'ruoyi-scan \d+\.\d+\.\d+') { throw "unexpected -V output: $ver" }
          Write-Host "version: $ver"

          $plugins = & "$iso/ruoyi-scan.exe" --plugin-list | Out-String
          if ($plugins -notmatch '(?m)^\s*54\s') { throw "plugin list incomplete (expect 54 POC)" }
          $chains = & "$iso/ruoyi-scan.exe" --chain-list | Out-String
          if ($chains -notmatch 'ruoyi_sql_to_rce') { throw "--chain-list missing builtin chain" }
          Write-Host "PLUGINS_OK (54) / CHAINS_OK"

          # 起本地签名靶场（flask 只在 CI 用，不进 exe）
          pip install flask==3.1.2
          $env:LAB_MODE = "vuln"
          $env:LAB_PORT = "18081"
          $lab = Start-Process -FilePath "python" -ArgumentList "lab/server.py" -PassThru -WindowStyle Hidden
          try {
            $up = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                if ((Invoke-WebRequest -Uri "http://127.0.0.1:18081/" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $up = $true; break }
              } catch { }
              if ($lab.HasExited) { throw "lab exited early with code $($lab.ExitCode)" }
            }
            if (-not $up) { throw "lab not ready on 18081" }

            $out = "$env:RUNNER_TEMP\ruoyi-cli-report"
            & "$iso/ruoyi-scan.exe" -p http://127.0.0.1:18081/ --report $out --no-pause --no-cta
            if ($LASTEXITCODE -ne 0) { throw "scan exited with $LASTEXITCODE" }
            foreach ($f in @("report.html", "report.json", "report.csv", "report.pdf", "report.docx", "report.xlsx", "report.sarif")) {
              if (-not (Test-Path (Join-Path $out $f))) { throw "missing report file: $f" }
            }
            Write-Host "CLI_SCAN_OK (7 report formats)"
          } finally {
            Get-Process -Id $lab.Id -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # ---------- 阶段 2：Tauri 打包（build.rs 编译期嵌入引擎）----------
      - name: Build Tauri NSIS bundle
        run: |
          cd desktop
          npm ci
          npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        env:
          # 经 env 传递，避免 tag 名插值进 PowerShell 脚本被当作子表达式执行
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $out = "desktop/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 单文件版（引擎已内嵌，免安装）
          Copy-Item "desktop/src-tauri/target/release/ruoyi-scan-desktop.exe" "$out/ruoyi-scan-desktop.exe"
          $setup = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" |
            Where-Object { $_.Name -like "*setup*" } |
            Select-Object -First 1
          if ($null -eq $setup) {
            $setup = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          }
          if ($null -eq $setup) { throw "NSIS setup exe not found" }
          Copy-Item $setup.FullName "$out/Ruoyi-Scan_${env:REF_NAME}_x64-setup.exe"
          # 终端版（console，免 Python；与 pip 版同一套 CLI 参数）
          Copy-Item "tools/cli_build/dist/ruoyi-scan.exe" "$out/ruoyi-scan.exe"
          # 三份纯文本文档随资产分发：下载者不用回仓库翻 README。
          # 文件名必须是 ASCII——GitHub 会把资产名里的非 ASCII 字符直接抹掉
          # （历史教训：ruoyi-scan_操作命令手册.txt 上传后变成 ruoyi-scan_.txt），
          # 所以 docs/promo 下的源文件也统一用 ASCII 名，复制时保持原名即可。
          Copy-Item "docs/promo/ruoyi-scan-*.txt" -Destination $out
          Get-ChildItem $out | Format-Table Name, Length

      # ---------- 阶段 3：单文件版冒烟（免安装直接双击场景）----------
      - name: Smoke test single-exe (portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 前置守卫：本阶段依赖「壳亲自拉起引擎」来验证 JobObject 回收。
          # 若 8123 已被占用，壳会走 port_open 早退（产品正确行为，但会使本测试失去意义）。
          if (Get-NetTCPConnection -LocalPort 8123 -State Listen -ErrorAction SilentlyContinue) {
            throw "port 8123 already in use before portable smoke — stale engine from earlier stage"
          }
          # 复制到独立目录模拟用户直接双击（不在仓库内、无安装器）
          $portable = "$env:RUNNER_TEMP\ruoyi-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "desktop/src-tauri/target/release/ruoyi-scan-desktop.exe" "$portable/Ruoyi-Scan.exe"

          $app = Start-Process -FilePath "$portable/Ruoyi-Scan.exe" -PassThru
          try {
            $ready = $false
            foreach ($i in 1..90) {
              Start-Sleep -Seconds 1
              try {
                $docs = Invoke-WebRequest -Uri "http://127.0.0.1:8123/docs" -UseBasicParsing -TimeoutSec 2
                if ($docs.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "single-exe engine not ready after 90s" }
            Write-Host "SINGLE_EXE_SMOKE_OK (engine up at 8123)"

            # 引擎自解压 + JobObject 挂接发生在壳 setup()，诊断落盘（GUI 壳 stderr 不可达）。
            # 若文件缺失 → 壳走了 port_open 早退（说明 8123 被外部占用），JobObject 未被验证。
            $diag = "$env:LOCALAPPDATA\Ruoyi-Scan\engine\job-diag.txt"
            if (Test-Path $diag) { Write-Host "JOB_DIAG: $(Get-Content $diag -Raw)" }
            else { throw "job-diag.txt missing — shell did not spawn engine (port already held?)" }

            # 强杀壳 → JobObject 应自动回收引擎
            Stop-Process -Id $app.Id -Force
            # 回收是异步的（内核关句柄 + 引擎树终止），轮询最多 15s
            $left = $null
            foreach ($i in 1..15) {
              Start-Sleep -Seconds 1
              $left = Get-Process -Name "ruoyi-scan-engine" -ErrorAction SilentlyContinue
              if ($null -eq $left) { break }
            }
            if ($null -ne $left) {
              Write-Host "ORPHAN PIDs: $($left.Id -join ',')"
              Write-Host "JOB_DIAG(after): $(Get-Content $diag -Raw)"
              $left | Stop-Process -Force
              throw "engine orphaned after shell hard-kill (JobObject not effective)"
            }
            Write-Host "JOB_OBJECT_REAP_OK"
          } finally {
            # 便携版被复制为 Ruoyi-Scan.exe，进程名是 Ruoyi-Scan（而非 ruoyi-scan-desktop）；
            # 按名清理并确认端口释放，失败即抛错（避免污染后续 NSIS 阶段）
            Get-Process -Name "Ruoyi-Scan","ruoyi-scan-engine" -ErrorAction SilentlyContinue | Stop-Process -Force
            $freed = $false
            foreach ($i in 1..15) {
              Start-Sleep -Seconds 1
              if (-not (Get-NetTCPConnection -LocalPort 8123 -State Listen -ErrorAction SilentlyContinue)) { $freed = $true; break }
            }
            if (-not $freed) { throw "port 8123 still held after portable smoke cleanup" }
          }

      # ---------- 阶段 4：NSIS 安装包冒烟（装机→自解压→探活→卸载）----------
      - name: Smoke test NSIS installer
        shell: pwsh
        env:
          # 经 env 传递，避免 tag 名插值进 PowerShell 脚本被当作子表达式执行
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          # 前置守卫：沿用 portable 阶段同样的要求 —— 8123 必须空闲，否则壳会早退
          if (Get-NetTCPConnection -LocalPort 8123 -State Listen -ErrorAction SilentlyContinue) {
            throw "port 8123 already in use before NSIS smoke — stale engine"
          }
          $setup = "desktop/artifacts/Ruoyi-Scan_${env:REF_NAME}_x64-setup.exe"
          # NSIS 静默安装（currentUser 模式无需管理员）
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

          # 定位安装目录（installMode=currentUser 静默安装默认 %LOCALAPPDATA%\Ruoyi-Scan）
          $appDir = "$env:LOCALAPPDATA\Ruoyi-Scan"
          if (-not (Test-Path "$appDir\ruoyi-scan-desktop.exe")) {
            $appDir = Get-ChildItem "$env:LOCALAPPDATA" -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName "ruoyi-scan-desktop.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not (Test-Path "$appDir\ruoyi-scan-desktop.exe")) { throw "installed app not found" }
          Write-Host "install dir: $appDir"

          # 启动应用（首次运行：自解压引擎到 %LOCALAPPDATA%\Ruoyi-Scan\engine\ → 拉起 → 探活）
          # try/finally 保证：探活/断言失败也执行关进程 + 卸载清理，避免残留影响后续运行；
          # 卸载回归断言放在 finally 之后（仅在卸载实际执行后才有意义）
          try {
            $app = Start-Process -FilePath "$appDir\ruoyi-scan-desktop.exe" -PassThru
            $ready = $false
            foreach ($i in 1..90) {
              Start-Sleep -Seconds 1
              try {
                $docs = Invoke-WebRequest -Uri "http://127.0.0.1:8123/docs" -UseBasicParsing -TimeoutSec 2
                if ($docs.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "engine not ready after install smoke" }
            if (-not (Test-Path "$env:LOCALAPPDATA\Ruoyi-Scan\engine\ruoyi-scan-engine.exe")) {
              throw "engine self-extract missing"
            }
            Write-Host "INSTALLER_SMOKE_OK (engine extracted + up at 8123)"
          } finally {
            # 清理：关应用 + 卸载（强杀壳时 JobObject 自动回收引擎）
            Get-Process -Name "ruoyi-scan-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force
            foreach ($i in 1..15) {
              Start-Sleep -Seconds 1
              if (-not (Get-NetTCPConnection -LocalPort 8123 -State Listen -ErrorAction SilentlyContinue)) { break }
            }
            Get-Process -Name "ruoyi-scan-engine" -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($appDir) {
              $unins = Get-ChildItem "$appDir" -Filter "unins*.exe" | Select-Object -First 1
              if ($unins) { Start-Process -FilePath $unins.FullName -ArgumentList "/S" -Wait }
            }
            Start-Sleep -Seconds 3
          }

          # 卸载回归：installerHooks.nsh (NSIS_HOOK_POSTUNINSTALL) 必须清掉运行时自解压的
          # 引擎缓存 %LOCALAPPDATA%\Ruoyi-Scan\engine\，否则卸载后残留 ~30MB
          if (Test-Path "$env:LOCALAPPDATA\Ruoyi-Scan\engine") {
            throw "uninstall left engine cache behind (installer-hooks.nsh not effective)"
          }
          Write-Host "UNINSTALL_CLEAN_OK (engine cache removed)"

      # ---------- 阶段 5：checksums + Release 上传 ----------
      - name: Generate checksums
        shell: pwsh
        run: |
          $out = "desktop/artifacts"
          Get-ChildItem "$out/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content "$out/checksums-desktop.txt"
          Get-Content "$out/checksums-desktop.txt"

      - name: Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/artifacts/Ruoyi-Scan_*_x64-setup.exe
            desktop/artifacts/ruoyi-scan-desktop.exe
            desktop/artifacts/ruoyi-scan.exe
            desktop/artifacts/ruoyi-scan-command-manual.txt
            desktop/artifacts/ruoyi-scan-usage-guide.txt
            desktop/artifacts/ruoyi-scan-plugins.txt
            desktop/artifacts/checksums-desktop.txt

      # 失败时保留引擎构建日志（webview2/资源缺失等问题的排查线索）
      - name: Upload engine build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-build-log
          path: |
            desktop/engine/build/**/*.log
            desktop/src-tauri/target/release/bundle/nsis/*.log
          if-no-files-found: ignore
