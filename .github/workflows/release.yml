# Release workflow：打 tag 自动构建 wheel + sdist + 校验和并上传到 GitHub Release
#
# 触发条件：推送 v* 格式的 tag（如 v1.1.0）
# 产物：ruoyi_scan-<version>-py3-none-any.whl + ruoyi_scan-<version>.tar.gz + checksums.txt
# 用户从 Release 页面下载后执行 pip install <file> 即可安装
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发：仅构建+冒烟，不上传 Release

permissions:
  contents: write  # 创建 Release 需要

jobs:
  release:
    name: Build & Publish to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # F8：生成 SHA256 校验文件（供应链完整性）
      - name: Generate checksums
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/checksums.txt
          cat dist/checksums.txt

      # 冒烟门禁：把构建产物装进全新 venv，验证 CLI 可启动、核心模块可导入、
      # 离线命令可运行。任何一步失败即终止发布（防止 v1.1.0/v1.2.0 那种
      # "包打出来了但装完跑不起来"的 Release 阻断问题再次出现）。
      - name: Smoke test built artifact
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          echo "== CLI banner + help =="
          /tmp/smoke-venv/bin/ruoyi-scan -h 2>&1 | tee /tmp/smoke_h.txt
          grep -q "Ruoyi-Scan" /tmp/smoke_h.txt
          echo "== 核心模块导入（common/cli/config/lib）=="
          /tmp/smoke-venv/bin/python -c "from common.logger import setup_logging; from common.models import ScanResult; from cli.runner import run_mode; from config import settings; from lib.colors import GREEN; print('IMPORT_OK')"
          echo "== 离线命令 --template-list =="
          /tmp/smoke-venv/bin/ruoyi-scan --template-list 2>&1 | tee /tmp/smoke_t.txt
          grep -q "quick" /tmp/smoke_t.txt
          echo "SMOKE_GATE_OK"

      - name: Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')  # 仅 tag 推送（正式发布）时上传
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
