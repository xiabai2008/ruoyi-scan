name: Ruoyi-Scan CI

# Scorecard Token-Permissions：显式最小权限（默认权限可能过宽）
permissions:
  contents: read

# 触发：push / PR 自动跑全部套件（含 real-ruoyi 真实 Java 靶场，D4 自动化验收）
# tags 触发：tag 推送时对 tag 指向的提交跑 CI，供 release.yml 的发布门禁等待
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一 workflow + ref 只保留最新一次运行：连续推送/PR 同步会取消尚未完成的旧 run，
# 避免重复启动多个靶场 + Maven 构建白耗 runner。
# 例外：tag 推送（v*）是 release.yml 发布门禁等待的对象，取消 in-progress tag run
# 会让门禁失去判据，因此 tag run 永不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── 代码质量门禁：ruff lint + format check + mypy 类型检查 ──────────
  lint:
    name: Lint & Type Check (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        # 版本固定：ruff format 的输出随版本演进（引号风格/空行规则），不固定会导致
        # CI 与本地格式化结果漂移（v1.2.3/v1.2.4 期间 CI 连红的根因）。升级时需本地
        # 重跑 ruff format 并同步此处与 pyproject dev 依赖。
        run: pip install ruff==0.16.2 mypy==2.1.0
      - name: Ruff lint
        # tests/ 纳入 lint 门禁：测试代码同样是仓库主体（65 文件），此前不受约束导致
        # 未用导入与导入顺序持续漂移。scripts/ 同理（含 CI 门禁脚本自身）。
        # desktop/ 与 lab/ 不纳入——前者为独立构建产物、后者是本地靶场脚本（可含一次性代码）。
        run: ruff check common/ core/ lib/ api/ plugins/ chains/ cli/ tests/ scripts/ main.py
      - name: Ruff format check
        run: ruff format --check common/ core/ lib/ api/ plugins/ chains/ cli/ main.py
      - name: Mypy type check（common/ + core/ 全量硬门禁，strict 模式）
        # G2 完成：core/ 25 文件全部 strict 清零（350 → 0），软门禁 `|| true` 移除。
        # 新增 core 文件须保持类型完整，回归即 CI 失败。
        # --no-warn-unused-ignores：strict 隐含开启的 unused-ignore 告警会因
        # python-docx 等第三方库浮动版本（untyped↔typed）造成跨环境误报。
        run: |
          mypy common/ --strict --ignore-missing-imports --no-warn-unused-ignores
          mypy core/ --strict --ignore-missing-imports --no-warn-unused-ignores
          # lib/ 整体尚未 strict 化（5700+ 语句），先锁定重构新增的两个基础模块
          mypy lib/reporter.py lib/soft404.py --strict --ignore-missing-imports --no-warn-unused-ignores
      - name: 检出能力矩阵门禁（无验证插件数不得增加）
        # 当前 13 个插件无任何自动化验证证据（见 docs/verification-matrix.md）。
        # 用上限而非「必须为 0」：立即清零不现实，但数量只应下降——新增插件若无任何
        # 验证证据会直接失败，避免「插件数涨、验证覆盖率降」这种静默劣化。
        run: python scripts/verification_matrix.py --check --max-none 13
      - name: 检出能力矩阵文档与脚本一致
        # 矩阵是脚本生成的，文档若与生成结果不一致说明有人手改或忘了重新生成
        run: |
          python scripts/verification_matrix.py > /tmp/matrix.md
          diff -u docs/verification-matrix.md /tmp/matrix.md

  # ── 单元 + 回归：纯 mock，最快，必跑 ─────────────────────────────
  # G2：增加 Windows matrix——国内使用主力环境之一，防编码（GBK）/路径分隔符回归
  unit:
    name: Unit & Regression (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pytest (core unit tests + coverage)
        # pytest-timeout 的 signal 方法仅 POSIX 可用，Windows 用 thread
        # 不再用 --cov-fail-under 设全仓统一门槛：统一阈值会让低覆盖模块躲在平均值
        # 后面（lib/ 5774 语句仅 75%，api/ 88%——均值把它们拉平）。改为下方按目录棘轮。
        run: >
          python -m pytest -q ${{ matrix.os == 'windows-latest' && '--timeout-method=thread' || '--timeout-method=signal' }}
          --cov=core --cov=common --cov=lib --cov=api --cov=plugins --cov=chains
          --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: 覆盖率棘轮（按目录，阈值取当前值下浮 3 个点，只许升不许降）
        # 各目录当前实测值：core 81% / common 87% / lib 75% / api 88% / plugins 78% / chains 100%。
        # 覆盖率的绝对值不代表质量，但「不得下降」是可靠的质量约束——新增代码若无测试
        # 覆盖会直接失败，逼着补测试或明确下调阈值（下调需改这一行，是有意识的决定）。
        run: |
          coverage report --include="*/core/*"    --fail-under=78
          coverage report --include="*/common/*"  --fail-under=84
          coverage report --include="*/lib/*"     --fail-under=72
          coverage report --include="*/api/*"     --fail-under=85
          coverage report --include="*/plugins/*" --fail-under=75
          coverage report --include="*/chains/*"  --fail-under=95
      - name: Regression ruoyi
        run: python tests/regression_ruoyi.py
      - name: Regression spring
        run: python tests/regression_spring.py
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── 签名靶场端到端：2 个 vuln 模式靶场（ruoyi + spring），断言全部 CONFIRMED ──
  signature-e2e:
    name: Signature Labs E2E (vuln mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: RuoYi signature lab
        # allow-safe 名单均为「结构性非 CONFIRMED」插件：Redis/MinIO/RocketMQ 为中间件
        # 探测（靶机无该服务即 SAFE）；shiro_rememberme 是指纹类探测，设计上只有
        # SAFE（无特征）/UNKNOWN（有特征需验密钥）两种判定，永远不可能 CONFIRMED。
        run: |
          python scripts/run_e2e.py --lab lab/server.py --lab-port 8080 \
            --target http://127.0.0.1:8080/ --mode p \
            --report-dir /tmp/e2e/ruoyi --name ruoyi-signature --require-all-confirmed \
            --allow-safe "Redis 未授权访问,MinIO 未授权访问,RocketMQ Dashboard 未授权,shiro_rememberme"
      - name: Spring signature lab
        run: |
          python scripts/run_e2e.py --lab lab/spring_server.py --lab-port 8091 \
            --target http://127.0.0.1:8091/ --mode p \
            --report-dir /tmp/e2e/spring --name spring-signature --require-all-confirmed \
            --allow-safe "Redis 未授权访问,MinIO 未授权访问,RocketMQ Dashboard 未授权,shiro_rememberme"

  # ── G4：RuoYi nuclei 模板包验证（语法校验 + 签名靶场双模式功能门）──
  # 功能门 = 与本地 EVIDENCE.md 相同的判定：vuln 模式 ≥3 命中、safe 模式 0 误报
  nuclei-templates:
    name: Nuclei Template Pack (validate + lab gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements.txt"  # 该 job 装的是根 requirements.txt（nuclei + lab 运行依赖）
      - name: Install lab dependencies
        run: pip install -r requirements.txt
      - name: Install nuclei (pinned)
        run: |
          curl -sSL -o nuclei.zip https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          # SHA256 取自 GitHub Release API v3.11.1 资产 digest：校验失败即中止，防止被篡改/替换的归档被执行
          echo "ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6  nuclei.zip" | sha256sum -c -
          unzip -q nuclei.zip -d nuclei-bin
          ./nuclei-bin/nuclei -version
      - name: Validate templates
        run: ./nuclei-bin/nuclei -duc -validate -t contrib/nuclei-templates/
      - name: Lab dual-mode functional gate
        run: |
          set -euo pipefail
          run_scan() {  # $1=port
            ./nuclei-bin/nuclei -duc -silent -nc -u "http://127.0.0.1:$1" -t contrib/nuclei-templates/ \
              | grep -cE '^\[ruoyi-' || true
          }
          wait_lab() {  # $1=port
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$1/" >/dev/null 2>&1 && return 0
              sleep 0.5
            done
            echo "lab on port $1 not healthy"; exit 1
          }
          # vuln 模式：必须命中 >= 3（模板有效性）
          LAB_MODE=vuln LAB_PORT=18080 LAB_HOST=127.0.0.1 python lab/server.py > /tmp/lab-vuln.log 2>&1 &
          LAB_PID=$!
          wait_lab 18080
          VULN=$(run_scan 18080)
          kill $LAB_PID
          [ "$VULN" -ge 3 ] || { echo "expected >=3 findings, got $VULN"; exit 1; }
          echo "vuln mode findings: $VULN"
          # safe 模式：必须 0（误报红线）
          LAB_MODE=safe LAB_PORT=18081 LAB_HOST=127.0.0.1 python lab/server.py > /tmp/lab-safe.log 2>&1 &
          LAB_PID=$!
          wait_lab 18081
          SAFE=$(run_scan 18081)
          kill $LAB_PID
          [ "$SAFE" -eq 0 ] || { echo "false positives in safe mode: $SAFE"; exit 1; }
          echo "safe mode findings: 0 (no false positive)"

  # ── D8 报告格式验收：PDF/Word/Excel 生成 + 去重聚合 + 降级 ──────────
  report-format:
    name: D8 Report Formats (PDF/Word/Excel + Dedup)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies (含 D8 可选依赖)
        run: pip install -r requirements-dev.txt
      - name: D8 单元测试（dedup + PDF + Word + Excel + CLI 集成）
        run: python -m pytest tests/test_dedup.py tests/test_report_pdf.py tests/test_report_docx.py tests/test_report_xlsx.py tests/test_d8_cli.py -v --timeout-method=signal
      - name: 全格式生成冒烟（render_all formats=all → 7 文件）
        run: |
          python -c "
          import tempfile, os
          from core.report import ReportBuilder
          from common.models import ScanResult, STATUS_CONFIRMED, SEVERITY_HIGH
          r = ScanResult(kind='vuln', name='测试漏洞', severity=SEVERITY_HIGH,
                         status=STATUS_CONFIRMED, url='http://x.com/test',
                         evidence='proof', fix='patch it')
          b = ReportBuilder(results=[r], target='http://x.com')
          with tempfile.TemporaryDirectory() as d:
              paths = b.render_all(d, formats='all')
              assert len(paths) == 7, f'Expected 7 files, got {len(paths)}: {paths}'
              for p in paths:
                  assert os.path.exists(p), f'Missing: {p}'
              print(f'OK: 7 report files generated')
          "

  # ── D7 WAF 绕过验收：策略库 + 引擎集成 + 端到端绕过 + 成功率追踪 ──
  waf-bypass:
    name: D7 WAF Bypass (Strategies + E2E + Stats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: D7 全量测试（tamper + bypass + origin + engine + plugins + acceptance + stats）
        run: python -m pytest tests/test_tamper.py tests/test_waf_bypass.py tests/test_origin_finder.py tests/test_d7_engine.py tests/test_d7_plugins.py tests/test_d7_acceptance.py tests/test_d7_stats.py -v --timeout-method=signal

  # ── D9 Web API 验收：FastAPI + WebSocket + 编排器 ──────────────────
  web-api:
    name: D9 Web API (FastAPI + WebSocket + Orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: D9 全量测试（orchestrator + API + WebSocket + 报告下载）
        run: python -m pytest tests/test_orchestrator.py tests/test_api_scan.py tests/test_api_ws.py -v --timeout-method=signal

  # ── 真实 Spring 靶场：纯 Flask，轻量，自动跑 ─────────────────────
  real-spring:
    name: Real Spring target (Flask)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Scan real-spring lab (expect >= 11 CONFIRMED)
        run: |
          python scripts/run_e2e.py --lab lab/real-spring/server.py --lab-port 8086 \
            --target http://127.0.0.1:8086/ --mode p \
            --report-dir /tmp/e2e/real-spring --name real-spring --min-confirmed 11

  # ── 真实 RuoYi 靶场：Java + MySQL + Maven，D4 自动化验收 ────────
  # lab/real-ruoyi/ 完整 Java 源码未纳入 git（体积过大），常规 CI 无法执行该验收。
  # 因此改为显式 opt-in：仓库变量 REAL_RUOYI=true 时才运行（可见为 skipped，而非静默通过）；
  # 启用后源码缺失或验收失败一律让 CI 变红，不再用 continue-on-error 掩盖。
  real-ruoyi:
    name: Real RuoYi target (Java + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit
    if: vars.REAL_RUOYI == 'true'
    env:
      # CI 临时库凭据：优先取仓库 secret，未配置时退化为本次 run_id（一次性、非真实凭据）
      CI_DB_USER: ruoyi_ci
      CI_DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || github.run_id }}
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || github.run_id }}
          MYSQL_DATABASE: ry
          # 非 root 最小权限账号：仅拥有 ry 库权限，避免 root/root 式硬编码被复制进真实配置
          MYSQL_USER: ruoyi_ci
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || github.run_id }}
        ports:
          - 3306:3306
        # 健康检查不带口令：mysqladmin ping 只要能连上端口就返回 0（即使 Access denied），
        # 无需把任何凭据写进 options 字符串
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Maven & MySQL client
        run: sudo apt-get update && sudo apt-get install -y maven mysql-client
      - name: Check RuoYi source availability
        # 已显式 opt-in（vars.REAL_RUOYI=true），源码缺失即失败：绝不静默降级为 no-op
        run: |
          if [ -f lab/real-ruoyi/pom.xml ]; then
            echo "RuoYi 源码可用，继续构建"
          else
            echo "::error::已显式启用 real-ruoyi 验收（vars.REAL_RUOYI=true），但 lab/real-ruoyi/ 源码缺失。"
            echo "请运行 scripts/setup-real-ruoyi.sh 获取源码后重试。"
            exit 1
          fi
      - name: Import SQL
        run: |
          for f in lab/real-ruoyi/sql/*.sql; do
            echo "Importing $f"
            MYSQL_PWD="$CI_DB_PASSWORD" mysql -h 127.0.0.1 -P 3306 -u "$CI_DB_USER" ry < "$f"
          done
      - name: Build & start RuoYi (background)
        run: |
          cd lab/real-ruoyi
          mvn -q -B package -DskipTests
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar --server.port=8080 > /tmp/ruoyi.log 2>&1 &
      - name: Scan real-ruoyi (expect >= 5 CONFIRMED)
        run: |
          python scripts/run_e2e.py --target http://127.0.0.1:8080/ \
            --mode p --report-dir /tmp/e2e/real-ruoyi \
            --name real-ruoyi --min-confirmed 5 --timeout 120
