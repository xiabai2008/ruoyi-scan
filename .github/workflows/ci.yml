name: Ruoyi-Scan CI

# 触发：push / PR 自动跑全部套件（含 real-ruoyi 真实 Java 靶场，D4 自动化验收）
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── 单元 + 回归：纯 mock，最快，必跑 ─────────────────────────────
  unit:
    name: Unit & Regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (core unit tests)
        run: python -m pytest -q
      - name: Regression ruoyi
        run: python tests/regression_ruoyi.py
      - name: Regression spring
        run: python tests/regression_spring.py

  # ── 签名靶场端到端：2 个 vuln 模式靶场（ruoyi + spring），断言全部 CONFIRMED ──
  signature-e2e:
    name: Signature Labs E2E (vuln mode)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: RuoYi signature lab
        run: |
          python scripts/run_e2e.py --lab lab/server.py --lab-port 8080 \
            --target http://127.0.0.1:8080/ --mode p \
            --report-dir /tmp/e2e/ruoyi --name ruoyi-signature --require-all-confirmed
      - name: Spring signature lab
        run: |
          python scripts/run_e2e.py --lab lab/spring_server.py --lab-port 8091 \
            --target http://127.0.0.1:8091/ --mode p \
            --report-dir /tmp/e2e/spring --name spring-signature --require-all-confirmed

  # ── D8 报告格式验收：PDF/Word/Excel 生成 + 去重聚合 + 降级 ──────────
  report-format:
    name: D8 Report Formats (PDF/Word/Excel + Dedup)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (含 D8 可选依赖)
        run: pip install -r requirements.txt
      - name: D8 单元测试（dedup + PDF + Word + Excel + CLI 集成）
        run: python -m pytest tests/test_dedup.py tests/test_report_pdf.py tests/test_report_docx.py tests/test_report_xlsx.py tests/test_d8_cli.py -v
      - name: 全格式生成冒烟（render_all formats=all → 6 文件）
        run: |
          python -c "
          import tempfile, os
          from core.report import ReportBuilder
          from core.models import ScanResult, STATUS_CONFIRMED, SEVERITY_HIGH
          r = ScanResult(kind='vuln', name='测试漏洞', severity=SEVERITY_HIGH,
                         status=STATUS_CONFIRMED, url='http://x.com/test',
                         evidence='proof', fix='patch it')
          b = ReportBuilder(results=[r], target='http://x.com')
          with tempfile.TemporaryDirectory() as d:
              paths = b.render_all(d, formats='all')
              assert len(paths) == 6, f'Expected 6 files, got {len(paths)}: {paths}'
              for p in paths:
                  assert os.path.exists(p), f'Missing: {p}'
              print(f'OK: 6 report files generated')
          "

  # ── D7 WAF 绕过验收：策略库 + 引擎集成 + 端到端绕过 + 成功率追踪 ──
  waf-bypass:
    name: D7 WAF Bypass (Strategies + E2E + Stats)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: D7 全量测试（tamper + bypass + origin + engine + plugins + acceptance + stats）
        run: python -m pytest tests/test_tamper.py tests/test_waf_bypass.py tests/test_origin_finder.py tests/test_d7_engine.py tests/test_d7_plugins.py tests/test_d7_acceptance.py tests/test_d7_stats.py -v

  # ── D9 Web API 验收：FastAPI + WebSocket + 编排器 ──────────────────
  web-api:
    name: D9 Web API (FastAPI + WebSocket + Orchestrator)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: D9 全量测试（orchestrator + API + WebSocket + 报告下载）
        run: python -m pytest tests/test_orchestrator.py tests/test_api_scan.py tests/test_api_ws.py -v

  # ── 真实 Spring 靶场：纯 Flask，轻量，自动跑 ─────────────────────
  real-spring:
    name: Real Spring target (Flask)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scan real-spring lab (expect >= 11 CONFIRMED)
        run: |
          python scripts/run_e2e.py --lab lab/real-spring/server.py --lab-port 8086 \
            --target http://127.0.0.1:8086/ --mode p \
            --report-dir /tmp/e2e/real-spring --name real-spring --min-confirmed 11

  # ── 真实 RuoYi 靶场：Java + MySQL + Maven，D4 自动化验收 ────────
  real-ruoyi:
    name: Real RuoYi target (Java + MySQL)
    runs-on: ubuntu-latest
    needs: unit
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ry
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Maven & MySQL client
        run: sudo apt-get update && sudo apt-get install -y maven mysql-client
      - name: Import SQL
        run: |
          for f in lab/real-ruoyi/sql/*.sql; do
            echo "Importing $f"
            mysql -h 127.0.0.1 -P 3306 -uroot -proot ry < "$f"
          done
      - name: Build & start RuoYi (background)
        run: |
          cd lab/real-ruoyi
          mvn -q -B package -DskipTests
          nohup java -jar ruoyi-admin/target/ruoyi-admin.jar --server.port=8080 > /tmp/ruoyi.log 2>&1 &
      - name: Scan real-ruoyi (expect >= 5 CONFIRMED)
        run: |
          python scripts/run_e2e.py --target http://127.0.0.1:8080/ \
            --mode p --report-dir /tmp/e2e/real-ruoyi \
            --name real-ruoyi --min-confirmed 5 --timeout 120
