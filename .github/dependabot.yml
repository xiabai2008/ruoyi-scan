# Dependabot：依赖与 Actions 版本自动更新（G4 供应链卫生）
version: 2
updates:
  # Python 依赖（requirements*.txt / pyproject）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      # codeql-action 的 init / analyze / upload-sarif 必须同主版本：混用会在 analyze
      # 阶段报 "CodeQL job status was configuration error"。不带分组时 Dependabot 按
      # 动作路径拆成多个 PR（#20 init / #22 analyze），各自只升半边、双双 CI 失败。
      codeql-action:
        patterns:
          - "github/codeql-action*"
