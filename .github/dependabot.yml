# Dependabot：依赖与 Actions 版本自动更新（G4 供应链卫生）
version: 2
updates:
  # Python 依赖（requirements*.txt / pyproject）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 靶场依赖（lab/requirements.txt，独立依赖集，此前未被 Dependabot 覆盖）
  - package-ecosystem: pip
    directory: "/lab"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # 与 pip 保持一致：minor/patch 合并为单个 PR，避免一批 Actions 小版本各自开 PR
    # 挤占 open-pull-requests-limit 配额（major 仍单独开 PR 供人工评估）
    groups:
      # codeql-action 的 init / analyze / upload-sarif 必须同主版本：混用会在 analyze
      # 阶段报 "CodeQL job status was configuration error"。不带分组时 Dependabot 会把
      # 动作路径拆成多个 PR，各自只升半边、双双 CI 失败
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 桌面端前端依赖（desktop/package.json + lock，React/Vite 工具链）
  # 此前仅靠人工月度检查，npm 生态长期不升级易积累安全与兼容债
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 桌面端 Rust 壳依赖（desktop/src-tauri/Cargo.toml + lock，Tauri 主版本与前端需成对评估）
  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
