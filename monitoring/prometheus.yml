# D16 Prometheus 抓取配置
# 抓取 Ruoyi-Scan API 服务的 /api/system/metrics 端点
global:
  scrape_interval: 15s          # 默认 15 秒抓取一次
  evaluation_interval: 15s      # 规则评估间隔
  external_labels:
    monitor: 'ruoyi-scan-monitor'

scrape_configs:
  # 抓取 Ruoyi-Scan API 服务
  - job_name: 'ruoyi-scan-api'
    metrics_path: '/api/system/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'ruoyi-scan'
          env: 'docker'

  # 抓取 Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# 告警规则（可选）：仓库未提供规则文件，docker-compose.yml 也未挂载 rules 目录，
# 因此不声明 rule_files（避免「配置了但永不加载」的虚假监控覆盖）；需要时补规则并挂载目录
